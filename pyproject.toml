[project]
name = "ai-efficiency-analyzer"
version = "0.1.0"
description = "AI业务调研提效分析系统"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "python-docx>=0.8.11",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "openai>=1.0.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
packaging = ["pyinstaller>=6.0.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
main = "entry.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
