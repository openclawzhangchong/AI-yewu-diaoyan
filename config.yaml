# AI业务调研提效分析系统 - 配置文件

# 模型配置
model:
  provider: "qwen"  # openai / qwen / zhipu
  api_key: ""
  base_url: ""
  model_name: "qwen-turbo"

# 分析配置
analysis:
  max_concurrent: 4
  timeout_seconds: 120

# 日志配置
logging:
  level: "INFO"
  file: "./logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# 输出配置
output:
  directory: "./output"
  default_format: "markdown"  # markdown / excel / json
